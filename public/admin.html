<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — Musician Linktree</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/apple.css" />
</head>
<body>
  <!-- No-auth banner -->
  <div class="alert alert-warning rounded-0 mb-0 text-center small py-2" role="alert">
    ⚠ This admin console is unauthenticated. Do not expose this server to the public internet.
  </div>

  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <h1 class="h4 fw-semibold mb-0">Musician Linktree</h1>
      <button id="btn-new-artist" class="btn btn-primary btn-sm">+ New Artist</button>
    </div>

    <!-- Artist list -->
    <div id="artists-loading" class="text-secondary text-center py-5">Loading…</div>
    <div id="artists-empty" class="text-secondary text-center py-5 d-none">No artists yet. Create one to get started.</div>
    <div id="artists-list" class="d-none row g-3"></div>
  </div>

  <!-- Artist modal -->
  <div class="modal fade" id="artist-modal" tabindex="-1" aria-labelledby="artist-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content glass">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-semibold" id="artist-modal-label">New Artist</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="artist-form" novalidate>
            <div class="mb-3">
              <label class="form-label small fw-medium">Handle <span class="text-danger">*</span></label>
              <input id="af-handle" name="handle" type="text" class="form-control" placeholder="e.g. jane-doe" required />
              <div class="form-text">Lowercase letters, digits, hyphens, underscores. 2–30 chars.</div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Display Name <span class="text-danger">*</span></label>
              <input id="af-displayName" name="displayName" type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Bio</label>
              <textarea id="af-bio" name="bio" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Avatar URL</label>
              <input id="af-avatarUrl" name="avatarUrl" type="url" class="form-control" placeholder="https://…" />
            </div>
            <div id="artist-form-error" class="alert alert-danger py-2 small d-none"></div>
          </form>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="artist-form-submit" class="btn btn-sm btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Links modal -->
  <div class="modal fade" id="links-modal" tabindex="-1" aria-labelledby="links-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-semibold" id="links-modal-label">Links</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="links-list-admin" class="mb-3"></div>
          <hr />
          <h6 class="fw-medium mb-3">Add Link</h6>
          <form id="link-form" novalidate>
            <div class="row g-2">
              <div class="col-sm-5">
                <input id="lf-label" type="text" class="form-control form-control-sm" placeholder="Label *" required />
              </div>
              <div class="col-sm-5">
                <input id="lf-url" type="url" class="form-control form-control-sm" placeholder="https://… *" required />
              </div>
              <div class="col-sm-2">
                <input id="lf-icon" type="text" class="form-control form-control-sm" placeholder="Icon" />
              </div>
            </div>
            <div id="link-form-error" class="alert alert-danger py-2 small d-none mt-2"></div>
            <button type="submit" class="btn btn-sm btn-primary mt-2">Add</button>
          </form>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content glass">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-semibold">Delete Artist?</h5>
        </div>
        <div class="modal-body">
          <p id="delete-modal-body" class="small text-secondary mb-0"></p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="delete-confirm-btn" class="btn btn-sm btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
