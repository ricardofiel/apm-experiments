<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/apple.css" />
</head>
<body>
  <div id="loading" class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading…</span></div>
  </div>

  <main id="profile" class="container-narrow py-5 text-center d-none">
    <img id="avatar" src="" alt="" class="avatar mb-3 d-none" />
    <h1 id="display-name" class="fw-semibold mb-1"></h1>
    <p id="bio" class="text-secondary mb-4"></p>
    <div id="links-list" class="d-flex flex-column gap-3"></div>
  </main>

  <div id="not-found" class="d-flex flex-column justify-content-center align-items-center min-vh-100 gap-2 d-none">
    <p class="fs-1">🎵</p>
    <h2 class="fw-semibold">Artist not found</h2>
    <p class="text-secondary">This handle doesn't exist yet.</p>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/artist.js"></script>
</body>
</html>
